<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dragon Flight Clone</title>
    <style>
        /* Thiết lập giao diện cơ bản */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e; /* Màu nền tối */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        /* Khung Game */
        #gameCanvas {
            background-color: #16213e;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            cursor: none; /* Ẩn con trỏ chuột khi chơi */
        }

        /* Giao diện điểm số và thông báo */
        #uiContainer {
            position: absolute;
            top: 20px;
            text-align: center;
            pointer-events: none; /* Không cản trở thao tác chuột */
            z-index: 10;
        }

        h1 { margin: 0; font-size: 24px; text-shadow: 2px 2px 4px #000; }
        #gameOverText { display: none; margin-top: 200px; font-size: 30px; color: #e94560; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        #restartHint { display: none; font-size: 16px; margin-top: 10px; color: #a2a2bd; }
    </style>
</head>
<body>

    <div id="uiContainer">
        <h1 id="scoreEl">Điểm: 0</h1>
        <div id="gameOverText">GAME OVER</div>
        <div id="restartHint">Click để chơi lại</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // Cài đặt Canvas
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreEl');
        const gameOverText = document.getElementById('gameOverText');
        const restartHint = document.getElementById('restartHint');

        // Kích thước game (tỷ lệ màn hình dọc)
        canvas.width = 400;
        canvas.height = 700;

        // Biến toàn cục
        let score = 0;
        let gameActive = true;
        let frameCount = 0;

        // Mảng chứa các đối tượng
        let bullets = [];
        let enemies = [];
        let particles = [];

        // --- LỚP NHÂN VẬT CHÍNH ---
        class Player {
            constructor() {
                this.width = 40;
                this.height = 40;
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height - 80;
                this.color = '#0f3460'; // Bạn sẽ thay bằng hình ảnh sau
            }

            draw() {
                // Vẽ thân nhân vật (Tạm thời là hình chữ nhật)
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Vẽ phần đầu cho ra dáng phi thuyền/nhân vật
                ctx.fillStyle = '#e94560';
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y - 15);
                ctx.lineTo(this.x + this.width, this.y);
                ctx.lineTo(this.x, this.y);
                ctx.fill();
            }

            update(mouseX) {
                // Nhân vật di chuyển theo trục X của chuột/cảm ứng
                this.x = mouseX - this.width / 2;

                // Giới hạn không cho bay ra ngoài màn hình
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;
                
                this.draw();
            }
        }

        // --- LỚP ĐẠN ---
        class Bullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.color = '#00d2ff';
                this.speed = 10; // Tốc độ đạn bay lên
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }

            update() {
                this.y -= this.speed;
                this.draw();
            }
        }

        // --- LỚP KẺ ĐỊCH ---
        class Enemy {
            constructor() {
                this.width = 50;
                this.height = 50;
                this.x = Math.random() * (canvas.width - this.width);
                this.y = -this.height; // Rơi từ trên cùng ngoài màn hình
                this.color = `hsl(${Math.random() * 360}, 70%, 50%)`; // Màu ngẫu nhiên
                this.speed = Math.random() * 2 + 2; // Tốc độ rơi từ 2 đến 4
                this.hp = 2; // Máu của quái
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }

            update() {
                this.y += this.speed;
                this.draw();
            }
        }

        // --- LỚP HIỆU ỨNG NỔ (PARTICLES) ---
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 3 + 1;
                this.color = color;
                this.velocity = {
                    x: (Math.random() - 0.5) * 6,
                    y: (Math.random() - 0.5) * 6
                };
                this.alpha = 1; // Độ mờ
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.02; // Mờ dần
                this.draw();
            }
        }

        // Khởi tạo nhân vật
        const player = new Player();
        let mouseX = canvas.width / 2;

        // Lắng nghe sự kiện di chuột & cảm ứng
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
        });

        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
        });

        // Click để chơi lại khi Game Over
        canvas.addEventListener('click', () => {
            if (!gameActive) restartGame();
        });

        // Hàm sinh kẻ địch
        function spawnEnemies() {
            // Tốc độ sinh quái tăng dần theo thời gian
            let spawnRate = Math.max(30, 100 - Math.floor(score / 50)); 
            if (frameCount % spawnRate === 0) {
                enemies.push(new Enemy());
            }
        }

        // Hàm tạo hiệu ứng nổ
        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // Khởi động lại game
        function restartGame() {
            score = 0;
            scoreEl.innerText = `Điểm: ${score}`;
            bullets = [];
            enemies = [];
            particles = [];
            gameActive = true;
            gameOverText.style.display = 'none';
            restartHint.style.display = 'none';
            animate();
        }

        // --- VÒNG LẶP GAME CHÍNH ---
        function animate() {
            if (!gameActive) return;

            // Xóa khung hình cũ để vẽ khung hình mới
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frameCount++;

            // Nhân vật tự động bắn đạn (mỗi 10 khung hình)
            if (frameCount % 10 === 0) {
                bullets.push(new Bullet(player.x + player.width / 2, player.y));
            }

            // Cập nhật nhân vật
            player.update(mouseX);

            // Cập nhật hiệu ứng hạt (xóa hạt đã mờ)
            particles.forEach((particle, index) => {
                if (particle.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    particle.update();
                }
            });

            // Cập nhật đạn (xóa đạn bay ra khỏi màn hình)
            bullets.forEach((bullet, bIndex) => {
                bullet.update();
                if (bullet.y + bullet.radius < 0) {
                    bullets.splice(bIndex, 1);
                }
            });

            spawnEnemies();

            // Cập nhật kẻ địch & Xử lý va chạm
            enemies.forEach((enemy, eIndex) => {
                enemy.update();

                // 1. Va chạm giữa Kẻ địch và Đáy màn hình (Trừ điểm hoặc bỏ qua)
                if (enemy.y > canvas.height) {
                    enemies.splice(eIndex, 1);
                }

                // 2. Va chạm giữa Kẻ địch và Đạn
                bullets.forEach((bullet, bIndex) => {
                    if (
                        bullet.x > enemy.x &&
                        bullet.x < enemy.x + enemy.width &&
                        bullet.y > enemy.y &&
                        bullet.y < enemy.y + enemy.height
                    ) {
                        // Xóa đạn
                        bullets.splice(bIndex, 1);
                        // Trừ máu quái
                        enemy.hp -= 1;

                        if (enemy.hp <= 0) {
                            createExplosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.color);
                            enemies.splice(eIndex, 1);
                            score += 10;
                            scoreEl.innerText = `Điểm: ${score}`;
                        }
                    }
                });

                // 3. Va chạm giữa Kẻ địch và Nhân vật (Game Over)
                if (
                    player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y
                ) {
                    gameActive = false;
                    createExplosion(player.x + player.width/2, player.y + player.height/2, player.color);
                    gameOverText.style.display = 'block';
                    restartHint.style.display = 'block';
                }
            });

            // Yêu cầu trình duyệt vẽ khung hình tiếp theo
            requestAnimationFrame(animate);
        }

        // Bắt đầu game
        animate();
    </script>
</body>
</html>
